<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" width="1040" height="410" role="img" aria-label="The 11 checks every action passes in order" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="410" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="408.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">THE ORDER EVERY ACTION GOES THROUGH</text><rect x="30" y="56" width="300" height="250" rx="14" fill="#e8f0fe" fill-opacity="0.55" stroke="#4a6fa5" stroke-width="1.5"/><text x="48" y="82" text-anchor="start" font-size="14.5" font-weight="700" fill="#1b2b45">Who is asking</text><rect x="44" y="96" width="272" height="42" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><circle cx="64" cy="117" r="11" fill="#4a6fa5"/><text x="64" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="84" y="122" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Details complete</text><rect x="44" y="146" width="272" height="42" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><circle cx="64" cy="167" r="11" fill="#4a6fa5"/><text x="64" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="84" y="164" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Identity verified</text><text x="84" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">phone matches the order</text><rect x="44" y="196" width="272" height="42" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><circle cx="64" cy="217" r="11" fill="#4a6fa5"/><text x="64" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="84" y="214" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Order read</text><text x="84" y="230" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">from the shop, not guessed</text><rect x="44" y="246" width="272" height="42" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><circle cx="64" cy="267" r="11" fill="#4a6fa5"/><text x="64" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="84" y="264" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Ownership</text><text x="84" y="280" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">the customer's own order</text><path d="M332,181 L353,181" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="355" y="56" width="300" height="250" rx="14" fill="#fdf3e1" fill-opacity="0.55" stroke="#b07a1f" stroke-width="1.5"/><text x="373" y="82" text-anchor="start" font-size="14.5" font-weight="700" fill="#3b2a08">Is it allowed</text><rect x="369" y="96" width="272" height="42" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.6"/><circle cx="389" cy="117" r="11" fill="#b07a1f"/><text x="389" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="409" y="114" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Permission</text><text x="409" y="130" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">for this tool</text><rect x="369" y="146" width="272" height="42" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.6"/><circle cx="389" cy="167" r="11" fill="#b07a1f"/><text x="389" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><text x="409" y="164" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Safety screen</text><text x="409" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">on this turn</text><rect x="369" y="196" width="272" height="42" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.6"/><circle cx="389" cy="217" r="11" fill="#b07a1f"/><text x="389" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><text x="409" y="214" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Policy check</text><text x="409" y="230" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">allow / deny / needs a person</text><path d="M657,181 L678,181" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="680" y="56" width="300" height="250" rx="14" fill="#e6f4ea" fill-opacity="0.55" stroke="#3b7d4f" stroke-width="1.5"/><text x="698" y="82" text-anchor="start" font-size="14.5" font-weight="700" fill="#12301c">Do it safely</text><rect x="694" y="96" width="272" height="42" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><circle cx="714" cy="117" r="11" fill="#3b7d4f"/><text x="714" y="121" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><text x="734" y="114" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Confirmation</text><text x="734" y="130" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">customer, or a person</text><rect x="694" y="146" width="272" height="42" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><circle cx="714" cy="167" r="11" fill="#3b7d4f"/><text x="714" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">9</text><text x="734" y="164" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Check again</text><text x="734" y="180" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">with the order as it is now</text><rect x="694" y="196" width="272" height="42" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><circle cx="714" cy="217" r="11" fill="#3b7d4f"/><text x="714" y="221" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10</text><text x="734" y="214" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Run once</text><text x="734" y="230" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">never repeated</text><rect x="694" y="246" width="272" height="42" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><circle cx="714" cy="267" r="11" fill="#3b7d4f"/><text x="714" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">11</text><text x="734" y="264" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Verify the result</text><text x="734" y="280" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">before saying "done"</text><rect x="30" y="326" width="980" height="62" rx="12" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/><text x="520" y="351" text-anchor="middle" font-size="13.5" font-weight="600" fill="#410e0b">A check that cannot run stops the action and hands the case to a person.</text><text x="520" y="372" text-anchor="middle" font-size="12" font-weight="400" fill="#410e0b">A person can approve what the rules allow with approval. A person can never turn a "no" from the rules into a "yes".</text></svg>