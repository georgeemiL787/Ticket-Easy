<!doctype html>
<html lang="en" data-theme="aurora-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket-Easy inbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/ui/aurora.css">
  <link rel="stylesheet" href="/inbox/static/style.css">
</head>
<body>
  <div class="aurora" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob glow"></i></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="page">
  <header class="top nav-glass">
    <h1><span class="logo-tile" aria-hidden="true"><svg viewBox="0 0 256 256"><path d="M128 16 96 96 16 128l80 32 32 80 32-80 80-32-80-32Z"/></svg></span> <span data-i18n="Inbox">Inbox</span></h1>
    <label><span data-i18n="Your name">Your name</span> <input id="agent" type="text" maxlength="80" placeholder="e.g. Sara" data-i18n-placeholder="e.g. Sara" autocomplete="off"></label>
    <label><span data-i18n="Business">Business</span> <input id="tenant" type="text" maxlength="64" value="shop_001" autocomplete="off"></label>
    <select id="lang" aria-label="Language" data-i18n-aria="Language"><option value="en">English</option><option value="ar">العربية</option></select>
    <button type="button" id="signout" data-i18n="Sign out" hidden>Sign out</button>
    <span id="refreshed" class="muted" role="status"></span>
  </header>
  <p id="error" class="error" role="alert" hidden></p>

  <div class="layout">
    <section class="list-pane glass" aria-label="Cases" data-i18n-aria="Cases">
      <form class="filters" id="filters">
        <select id="f-status" aria-label="Status" data-i18n-aria="Status">
          <option value="new" data-i18n="new (just arrived)">new (just arrived)</option><option value="active" selected data-i18n="open + claimed">open + claimed</option><option value="" data-i18n="any status">any status</option>
          <option value="open" data-i18n="open">open</option><option value="claimed" data-i18n="claimed">claimed</option>
          <option value="resolved" data-i18n="resolved">resolved</option><option value="returned_to_agent" data-i18n="returned to agent">returned to agent</option>
        </select>
        <select id="f-priority" aria-label="Priority" data-i18n-aria="Priority">
          <option value="" data-i18n="any priority">any priority</option><option value="urgent" data-i18n="urgent">urgent</option><option value="high" data-i18n="high">high</option>
          <option value="normal" data-i18n="normal">normal</option><option value="low" data-i18n="low">low</option>
        </select>
        <select id="f-reason" aria-label="Reason" data-i18n-aria="Reason"><option value="" data-i18n="any reason">any reason</option></select>
        <label class="inline"><input type="checkbox" id="f-mine"> <span data-i18n="mine">mine</span></label>
      </form>
      <table class="cases" id="cases">
        <thead><tr><th data-i18n="Priority">Priority</th><th data-i18n="Reason">Reason</th><th data-i18n="Lang">Lang</th><th data-i18n="Age">Age</th><th data-i18n="Status">Status</th><th data-i18n="Summary">Summary</th></tr></thead>
        <tbody id="case-rows"></tbody>
      </table>
      <p id="empty" class="muted" data-i18n="No cases match." hidden>No cases match.</p>
      <button type="button" id="more" data-i18n="Load more" hidden>Load more</button>
    </section>

    <section class="case-pane glass" id="case-pane" aria-label="Case" data-i18n-aria="Case" hidden>
      <div class="case-head">
        <button type="button" id="back" class="back" data-i18n="Back to list">Back to list</button>
        <h2 id="case-title"></h2>
        <div class="actions" id="actions"></div>
      </div>
      <div id="case-body"></div>
      <form id="reply-form" class="reply" autocomplete="off" hidden>
        <textarea id="reply-text" dir="auto" maxlength="2000" rows="3" placeholder="Write to the customer" aria-label="Reply" data-i18n-placeholder="Write to the customer" data-i18n-aria="Reply"></textarea>
        <button type="submit" class="primary" data-i18n="Send reply">Send reply</button>
      </form>
    </section>
  </div>
  </div>
  <script src="/ui/i18n.js"></script>
  <script src="/inbox/static/inbox.js"></script>
</body>
</html>
