[project]
name = "ticket-easy-team-c"
version = "0.1.0"
description = "Discovery and approval-to-build for business tools"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "openapi-spec-validator>=0.7,<0.9",
  "openapi-schema-validator>=0.6,<0.9",
  "itsdangerous>=2.2,<3",
  "mcp==2.2.0",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
