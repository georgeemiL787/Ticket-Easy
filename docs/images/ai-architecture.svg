<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="AI architecture: the AI jobs propose, code checks and decides" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1100" height="600" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1098.5" height="598.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">AI ARCHITECTURE: WHO PROPOSES, WHO DECIDES</text><rect x="30" y="52" width="14" height="14" rx="4" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="52" y="64" text-anchor="start" font-size="12" font-weight="400" fill="#475467">AI job: proposes only</text><rect x="210" y="52" width="14" height="14" rx="4" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="232" y="64" text-anchor="start" font-size="12" font-weight="400" fill="#475467">Code: decides, no AI</text><rect x="390" y="52" width="14" height="14" rx="4" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="412" y="64" text-anchor="start" font-size="12" font-weight="400" fill="#475467">Safety net</text><rect x="500" y="52" width="14" height="14" rx="4" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="522" y="64" text-anchor="start" font-size="12" font-weight="400" fill="#475467">External service or model</text><rect x="30" y="100" width="130" height="70" rx="35" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="95.0" y="130.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Customer</text><text x="95.0" y="148.5" text-anchor="middle" font-size="12" fill="#1f2937" fill-opacity="0.85">message</text><rect x="190" y="100" width="170" height="70" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="275.0" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2b45">Message reader</text><text x="275.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">small model:</text><text x="275.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">language, intent, details</text><rect x="400" y="100" width="190" height="70" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="495.0" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2b45">Planner</text><text x="495.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">strong model: picks ONE move</text><text x="495.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">at a time, replans</text><rect x="630" y="100" width="170" height="70" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="715.0" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#12301c">Move check</text><text x="715.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">on the menu, within</text><text x="715.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">limits, valid arguments</text><rect x="840" y="100" width="220" height="70" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="950.0" y="122.0" text-anchor="middle" font-size="14" font-weight="600" fill="#12301c">Action checks</text><text x="950.0" y="140.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">identity, ownership, permission,</text><text x="950.0" y="158.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">policy, confirm, run once, verify</text><path d="M160,135 L190,135" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M360,135 L400,135" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M590,122 L630,122" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="610" y="112" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475467">move</text><path d="M630,154 L590,154" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="610" y="186" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c5221f">refused</text><path d="M800,135 L840,135" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="30" y="250" width="210" height="70" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="135.0" y="271.8" text-anchor="middle" font-size="13.5" font-weight="600" fill="#202124">Knowledge service</text><text x="135.0" y="289.8" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">policy search and rule checks</text><text x="135.0" y="307.8" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">(local bge-m3 embeddings)</text><rect x="290" y="250" width="190" height="70" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="385.0" y="272.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2b45">Knowledge agent</text><text x="385.0" y="290.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">answers only from the</text><text x="385.0" y="308.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">passages it was given</text><rect x="520" y="250" width="190" height="70" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="615.0" y="272.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2b45">Reply writer</text><text x="615.0" y="290.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">small model: wording in</text><text x="615.0" y="308.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">the customer's language</text><rect x="770" y="250" width="190" height="70" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="865.0" y="272.0" text-anchor="middle" font-size="14" font-weight="600" fill="#12301c">Facts check</text><text x="865.0" y="290.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">no new number, date,</text><text x="865.0" y="308.0" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">id or link in any reply</text><rect x="995" y="265" width="80" height="40" rx="20" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="1035.0" y="289.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Reply</text><path d="M240,285 L290,285" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="265" y="276" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475467">passages</text><path d="M450,170 L450,210 L385,210 L385,250" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M540,170 L540,210 L615,210 L615,250" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="417" y="203" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475467">a question</text><text x="578" y="203" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475467">wording</text><path d="M385,320 L385,342 L830,342 L830,320" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M710,285 L770,285" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M960,285 L995,285" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M930,170 L930,210 L900,210 L900,250" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="940" y="205" text-anchor="start" font-size="10.5" font-weight="600" fill="#475467">verified result</text><rect x="770" y="400" width="290" height="76" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="915.0" y="425.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2b45">Reviewer</text><text x="915.0" y="443.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">strong model: second look at a write and at</text><text x="915.0" y="461.0" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">replies. It can only make things stricter.</text><path d="M860,400 L860,322" fill="none" stroke="#4a6fa5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="868" y="372" text-anchor="start" font-size="10.5" font-weight="600" fill="#4a6fa5">blocks, never loosens</text><path d="M1060,438 L1085,438 L1085,135 L1060,135" fill="none" stroke="#4a6fa5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="30" y="400" width="480" height="76" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="270.0" y="425.0" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2a08">Fixed step flow</text><text x="270.0" y="443.0" text-anchor="middle" font-size="11.5" fill="#3b2a08" fill-opacity="0.85">Used when the AI is off, fails, or a move is refused twice</text><text x="270.0" y="461.0" text-anchor="middle" font-size="11.5" fill="#3b2a08" fill-opacity="0.85">in a row. It goes through the same action checks.</text><path d="M745,170 L745,438 L510,438" fill="none" stroke="#b07a1f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="752" y="400" text-anchor="start" font-size="10.5" font-weight="600" fill="#b07a1f">gives up</text><text x="30" y="512" text-anchor="start" font-size="11.5" font-weight="700" fill="#667085">WHICH MODEL RUNS WHAT</text><rect x="30" y="524" width="246" height="56" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="153.0" y="547.5" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Strong model slot</text><text x="153.0" y="565.5" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">Groq. Planner and reviewer</text><rect x="292" y="524" width="246" height="56" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="415.0" y="547.5" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Small model slot</text><text x="415.0" y="565.5" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">Groq. Reader, reply writer, summaries</text><rect x="554" y="524" width="246" height="56" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="677.0" y="547.5" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Local embeddings</text><text x="677.0" y="565.5" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">Ollama bge-m3. Policy search</text><rect x="816" y="524" width="246" height="56" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="939.0" y="547.5" text-anchor="middle" font-size="13" font-weight="600" fill="#12301c">Code only</text><text x="939.0" y="565.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">Move check, action checks, facts check</text></svg>