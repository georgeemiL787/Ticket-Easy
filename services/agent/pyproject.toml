[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-easy-agent"
version = "0.1.0"
description = "Ticket-Easy Agent service: conversations, decisions, actions and human handoff"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
agent_service = ["adapters/migrations/*.sql"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "scenario: end-to-end conversation scenarios (scenarios/<tenant>)",
    "slow: performance tests, run with `pytest -m slow` (left out of the normal run)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
mypy_path = "src"
packages = ["agent_service"]
python_version = "3.11"
warn_unused_configs = true

# Strict checking for the safety-critical packages (per-module sections cannot use `strict = true`).
[[tool.mypy.overrides]]
module = [
  "agent_service.domain.*",
  "agent_service.ports.*",
  "agent_service.turn.*",
  "agent_service.understanding.*",
  "agent_service.agent.*",
  "agent_service.knowledge.*",
  "agent_service.actions.*",
  "agent_service.replies.*",
  "agent_service.handoff.*",
  "agent_service.monitoring.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
