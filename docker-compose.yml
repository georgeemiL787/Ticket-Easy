# Ticket-Easy demo. Two profiles (use `make demo` or `make demo-full`, see the README):
#   light  the service with the stand-in shop and policies, and a SQLite volume. Replies come from the rules.   (no AI model)
#   full   the same plus Ollama running qwen3:8b: the AI model helps understand messages (TEAM_B_LLM=ollama).
#   live   Team B talks to the real Team A service (policy search, safety screen, rule checker) with the stand-in shop.
#          Team A embeds with bge-m3 from the Ollama on the host (ollama pull bge-m3). No chat AI model.
# Only one profile runs at a time (all use port 8010).

x-team-b: &team-b
  build:
    context: .
    dockerfile: services/agent/Dockerfile
  image: ticket-easy-team-b
  ports:
    - "${TEAM_B_PORT:-8010}:8010"
  volumes:
    - team_b_data:/data
  restart: unless-stopped
  environment: &team-b-env
    TEAM_B_MODE: standin
    TEAM_B_STORE: sqlite
    TEAM_B_DB_PATH: /data/team_b.sqlite3
    TEAM_B_FIXED_TODAY: ${TEAM_B_FIXED_TODAY:-2026-09-28}   # the demo orders are dated against this day
    TEAM_B_LOG_JSON: ${TEAM_B_LOG_JSON:-true}
    TEAM_B_RATE_LIMIT_PER_MIN: ${TEAM_B_RATE_LIMIT_PER_MIN:-20}
    TEAM_B_RETENTION_DAYS: ${TEAM_B_RETENTION_DAYS:-90}
    TEAM_B_CAPABILITY_TTL_S: ${TEAM_B_CAPABILITY_TTL_S:-60}
    TEAM_B_QUEUE_MAX_RUNS: ${TEAM_B_QUEUE_MAX_RUNS:-3}
    TEAM_B_ALERT_INTERVAL_S: ${TEAM_B_ALERT_INTERVAL_S:-60}
    TEAM_B_ALERT_WEBHOOK: ${TEAM_B_ALERT_WEBHOOK:-}
    TEAM_B_AUTH_REQUIRED: ${TEAM_B_AUTH_REQUIRED:-1}
    TEAM_B_SECRET_KEY: ${TEAM_B_SECRET_KEY:-}
    TEAM_B_COOKIE_SECURE: ${TEAM_B_COOKIE_SECURE:-0}
    TEAM_B_SESSION_HOURS: ${TEAM_B_SESSION_HOURS:-12}
    TEAM_B_CHAT_API_KEYS: ${TEAM_B_CHAT_API_KEYS:-}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).status == 200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  team-b:
    <<: *team-b
    profiles: ["light"]

  team-b-full:
    <<: *team-b
    profiles: ["full"]
    environment:
      <<: *team-b-env
      TEAM_B_LLM: ollama
      OLLAMA_URL: http://ollama:11434
      TEAM_B_OLLAMA_MODEL: ${TEAM_B_OLLAMA_MODEL:-qwen3:8b}
      TEAM_B_LLM_TIMEOUT_S: ${TEAM_B_LLM_TIMEOUT_S:-60}
      # these three need the AI model, which this profile starts: they are on for the demo
      TEAM_B_LLM_REWRITE: ${TEAM_B_LLM_REWRITE:-1}
      TEAM_B_LLM_POLICY: ${TEAM_B_LLM_POLICY:-1}
      TEAM_B_LLM_KNOWLEDGE: ${TEAM_B_LLM_KNOWLEDGE:-1}
      TEAM_B_LLM_REVIEW: ${TEAM_B_LLM_REVIEW:-1}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["full"]
    volumes:
      - ollama_models:/root/.ollama
    # start the server, make sure the model is there (downloaded once, about 5 GB), then keep serving
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull $${TEAM_B_OLLAMA_MODEL:-qwen3:8b}; touch /tmp/model-ready; wait $$pid"]
    environment:
      TEAM_B_OLLAMA_MODEL: ${TEAM_B_OLLAMA_MODEL:-qwen3:8b}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/model-ready"]
      interval: 10s
      timeout: 3s
      retries: 180   # up to 30 minutes for the first download
      start_period: 20s

  # ---- profile "live": Team B + the real Team A and the tools service ----
  team-b-live:
    <<: *team-b
    profiles: ["live"]
    environment:
      <<: *team-b-env
      TEAM_B_MODE: live
      TEAM_B_TEAM_A_URL: http://team-a:8001
      TEAM_B_TEAM_A_KEY: ${TEAM_A_SERVICE_API_KEY:-}
      TEAM_B_TEAM_A_ADMIN_KEY: ${TEAM_A_ADMIN_API_KEY:-}
    depends_on:
      team-a:
        condition: service_healthy

  team-a:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    image: ticket-easy-team-a
    profiles: ["live"]
    volumes:
      - team_a_var:/app/services/knowledge/var
    restart: unless-stopped
    environment:
      # embeddings (bge-m3) come from the Ollama on the host machine: `ollama pull bge-m3` once.
      # Without it Team A builds a keyword-only index and still answers, with weaker search.
      OLLAMA_URL: ${TEAM_A_OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${TEAM_A_EMBED_MODEL:-bge-m3}
      ADMIN_API_KEY: ${TEAM_A_ADMIN_API_KEY:-}
      # set both and Team A answers only callers that send this key (Team B does); empty: anybody can search (local use only)
      SERVICE_API_KEY: ${TEAM_A_SERVICE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # the tools service: owners use its pages at http://localhost:8101; the agent is wired to it by hand (docs/INTEGRATION.md)
  tools:
    build:
      context: .
      dockerfile: services/tools/Dockerfile
    image: ticket-easy-tools
    profiles: ["live"]
    ports:
      - "127.0.0.1:${TOOLS_PORT:-8101}:8101"   # its owner pages have no sign-in: keep them on this machine
    volumes:
      - tools_data:/data
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/integration.sqlite3
      OPENAPI_FETCH_HOSTS: ${TOOLS_OPENAPI_FETCH_HOSTS:-loopback:*}
      SANDBOX_HOSTS: ${TOOLS_SANDBOX_HOSTS:-}
      # secrets come from the environment; empty session secret: a random one per start
      SESSION_SECRET: ${TOOLS_SESSION_SECRET:-}
      TEAM_C_ADMIN_TOKEN: ${TOOLS_ADMIN_TOKEN:-}
      LIVE_DEMO_ENABLED: ${TOOLS_LIVE_DEMO_ENABLED:-false}
      LIVE_DEMO_HOSTS: ${TOOLS_LIVE_DEMO_HOSTS:-}
      # model provider for proposals (Ollama on the host by default; Groq or OpenRouter with their keys)
      LLM_PRIMARY: ${TOOLS_LLM_PRIMARY:-ollama}
      OLLAMA_BASE_URL: ${TOOLS_OLLAMA_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  team_b_data:
  ollama_models:
  team_a_var:
  tools_data:
