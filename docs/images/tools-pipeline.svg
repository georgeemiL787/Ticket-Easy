<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="How a tool is generated from an API description" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="470" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="468.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">FROM AN API DESCRIPTION TO A TOOL THE AGENT CAN CALL</text><rect x="30" y="100" width="148" height="136" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><rect x="74.0" y="86" width="60" height="26" rx="13" fill="#b07a1f"/><text x="104.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Owner</text><text x="104.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a08">1 · Upload</text><text x="104.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">The shop's OpenAPI</text><text x="104.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">file, or fetched from</text><text x="104.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">the running system</text><rect x="200" y="100" width="148" height="136" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><rect x="244.0" y="86" width="60" height="26" rx="13" fill="#4a6fa5"/><text x="274.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">AI</text><text x="274.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#1b2b45">2 · Propose</text><text x="274.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b2b45">Which operations,</text><text x="274.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b2b45">in what order, where</text><text x="274.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#1b2b45">each input comes from</text><path d="M180,176 L198,176" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="370" y="100" width="148" height="136" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><rect x="414.0" y="86" width="60" height="26" rx="13" fill="#3b7d4f"/><text x="444.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Code</text><text x="444.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#12301c">3 · Ground</text><text x="444.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">Every step, field and</text><text x="444.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">link must exist in</text><text x="444.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">the API. Else rejected</text><path d="M350,176 L368,176" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="540" y="100" width="148" height="136" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><rect x="584.0" y="86" width="60" height="26" rx="13" fill="#b07a1f"/><text x="614.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Owner</text><text x="614.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#3b2a08">4 · Review</text><text x="614.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">Who may use it, plain</text><text x="614.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">answers to the AI's</text><text x="614.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3b2a08">questions, approve</text><path d="M520,176 L538,176" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="710" y="100" width="148" height="136" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><rect x="754.0" y="86" width="60" height="26" rx="13" fill="#3b7d4f"/><text x="784.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Code</text><text x="784.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#12301c">5 · Build + test</text><text x="784.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">No AI. Hashed, fixed.</text><text x="784.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">Sandbox tests incl.</text><text x="784.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">another customer refused</text><path d="M690,176 L708,176" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="880" y="100" width="148" height="136" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><rect x="924.0" y="86" width="60" height="26" rx="13" fill="#3b7d4f"/><text x="954.0" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">Code</text><text x="954.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#12301c">6 · Publish</text><text x="954.0" y="170" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">MCP tool. Each call</text><text x="954.0" y="188" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">re-checks approval,</text><text x="954.0" y="206" text-anchor="middle" font-size="11.5" font-weight="400" fill="#12301c">access and tests</text><path d="M860,176 L878,176" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M444.0,236 L444.0,266 L274.0,266 L274.0,238" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="359.0" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c5221f">fails: one retry, with the errors</text><path d="M784.0,236 L784.0,266 L614.0,266 L614.0,238" fill="none" stroke="#c5221f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="699.0" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#c5221f">wiring defect: AI repair, max 2 tries</text><rect x="30" y="350" width="980" height="84" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="46" y="376" text-anchor="start" font-size="13.5" font-weight="700" fill="#202124">Production is a separate step.</text><text x="46" y="398" text-anchor="start" font-size="12" font-weight="400" fill="#475467">An admin promotes a tool only when every automatic check passes: same approved version, access scoped to the verified customer, rate limits, a rollback contact, a smoke check.</text><text x="46" y="418" text-anchor="start" font-size="12" font-weight="400" fill="#475467">One service credential then serves all customers, and the tools service checks on every call that the record belongs to the customer. An error spike rolls the tool back.</text></svg>