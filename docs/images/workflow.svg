<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" role="img" aria-label="The whole Ticket-Easy workflow from setting up a business to the manager dashboard" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="500" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="498.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">THE WHOLE PROJECT, END TO END</text><rect x="30" y="62" width="215" height="300" rx="14" fill="#fdf3e1" fill-opacity="0.6" stroke="#b07a1f" stroke-width="1.5"/><circle cx="54" cy="90" r="11" fill="#b07a1f"/><text x="54" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="74" y="88" text-anchor="start" font-size="14.5" font-weight="700" fill="#3b2a08">Set up a business</text><text x="74" y="106" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Owner or admin, once</text><rect x="42" y="124" width="191" height="50" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.55"/><text x="54" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Business profile</text><text x="54" y="162" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">and guardrails (the limits)</text><rect x="42" y="182" width="191" height="50" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.55"/><text x="54" y="203" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Policy documents</text><text x="54" y="220" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">indexed for cited search</text><rect x="42" y="240" width="191" height="50" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.55"/><text x="54" y="261" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">OpenAPI description</text><text x="54" y="278" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">becomes owner-approved tools</text><rect x="42" y="298" width="191" height="50" rx="9" fill="#fff" stroke="#b07a1f" stroke-opacity="0.55"/><text x="54" y="319" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Test chat, then</text><text x="54" y="336" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Go live (versioned)</text><path d="M248,212 L282,212" fill="none" stroke="#667085" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="285" y="62" width="215" height="300" rx="14" fill="#e8f0fe" fill-opacity="0.6" stroke="#4a6fa5" stroke-width="1.5"/><circle cx="309" cy="90" r="11" fill="#4a6fa5"/><text x="309" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="329" y="88" text-anchor="start" font-size="14.5" font-weight="700" fill="#1b2b45">Customers talk to it</text><text x="329" y="106" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Every day, any hour</text><rect x="297" y="124" width="191" height="50" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.55"/><text x="309" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Message in English,</text><text x="309" y="162" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Arabic, mixed or Arabizi</text><rect x="297" y="182" width="191" height="50" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.55"/><text x="309" y="203" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Understand, then</text><text x="309" y="220" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">screen for risk</text><rect x="297" y="240" width="191" height="50" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.55"/><text x="309" y="261" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Answer from policy, look up</text><text x="309" y="278" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">the order, or ask for a detail</text><rect x="297" y="298" width="191" height="50" rx="9" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.55"/><text x="309" y="319" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Act: check, confirm,</text><text x="309" y="336" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">run once, verify, reply</text><path d="M503,212 L537,212" fill="none" stroke="#667085" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="540" y="62" width="215" height="300" rx="14" fill="#fce8e6" fill-opacity="0.6" stroke="#c5221f" stroke-width="1.5"/><circle cx="564" cy="90" r="11" fill="#c5221f"/><text x="564" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="584" y="88" text-anchor="start" font-size="14.5" font-weight="700" fill="#410e0b">A person steps in</text><text x="584" y="106" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Staff, only when needed</text><rect x="552" y="124" width="191" height="50" rx="9" fill="#fff" stroke="#c5221f" stroke-opacity="0.55"/><text x="564" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Triggered by risk, a rule</text><text x="564" y="162" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">or an unclear result</text><rect x="552" y="182" width="191" height="50" rx="9" fill="#fff" stroke="#c5221f" stroke-opacity="0.55"/><text x="564" y="203" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">A briefing lands in</text><text x="564" y="220" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">the staff inbox</text><rect x="552" y="240" width="191" height="50" rx="9" fill="#fff" stroke="#c5221f" stroke-opacity="0.55"/><text x="564" y="261" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Staff claim, reply,</text><text x="564" y="278" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">approve or reject</text><rect x="552" y="298" width="191" height="50" rx="9" fill="#fff" stroke="#c5221f" stroke-opacity="0.55"/><text x="564" y="319" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Or hand the case back</text><text x="564" y="336" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">to the agent</text><path d="M758,212 L792,212" fill="none" stroke="#667085" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="795" y="62" width="215" height="300" rx="14" fill="#e6f4ea" fill-opacity="0.6" stroke="#3b7d4f" stroke-width="1.5"/><circle cx="819" cy="90" r="11" fill="#3b7d4f"/><text x="819" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="839" y="88" text-anchor="start" font-size="14.5" font-weight="700" fill="#12301c">Managers keep watch</text><text x="839" y="106" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">Any time</text><rect x="807" y="124" width="191" height="50" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.55"/><text x="819" y="145" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Dashboard: answered,</text><text x="819" y="162" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">done, escalated, alerts</text><rect x="807" y="182" width="191" height="50" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.55"/><text x="819" y="203" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Questions it could not</text><text x="819" y="220" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">answer, by topic</text><rect x="807" y="240" width="191" height="50" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.55"/><text x="819" y="261" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Every decision logged</text><text x="819" y="278" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">with the reason</text><rect x="807" y="298" width="191" height="50" rx="9" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.55"/><text x="819" y="319" text-anchor="start" font-size="12.5" font-weight="600" fill="#1f2937">Knowledge base and</text><text x="819" y="336" text-anchor="start" font-size="11.5" font-weight="400" fill="#667085">guardrail status</text><path d="M537,252 L503,252" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M902.5,362 L902.5,394 L137.5,394 L137.5,364" fill="none" stroke="#3b7d4f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="520.0" y="390" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3b7d4f">Unanswered questions show which document to add next, and the cycle repeats</text><rect x="30" y="420" width="980" height="56" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="520" y="443" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Three services behind it: agent (8010), knowledge (8001), tools (8101)</text><text x="520" y="462" text-anchor="middle" font-size="12" font-weight="400" fill="#475467">The agent proposes, code decides, and nothing is done without the checks, the confirmation and a verified result.</text></svg>