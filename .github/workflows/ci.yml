# Every change to the repository is checked here. Team B's service is in team_b/, the dashboard app in dashboard/.
# The jobs below are the "required checks" to switch on in the branch protection of main and team-b (see team_b/docs/ci.md).
name: CI

on:
  pull_request:
  push:
    branches: [main, team-b]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            team_b/requirements.txt
            team_b/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (${{ matrix.store }} store)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [memory, sqlite]
    env:
      TEAM_B_STORE: ${{ matrix.store }}
    defaults:
      run:
        working-directory: team_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            team_b/requirements.txt
            team_b/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q

  scenarios:
    name: Scenario report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            team_b/requirements.txt
            team_b/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - name: Run every scenario and show the table in the job summary
        run: |
          set +e
          python scripts/scenario_report.py > scenario_report.txt
          status=$?
          {
            echo '## Scenario report'
            echo '```'
            cat scenario_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  schemas:
    name: JSON Schemas are up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team_b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            team_b/requirements.txt
            team_b/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - name: Export the schemas again and compare with the committed ones
        run: |
          python scripts/export_schemas.py > /dev/null
          git diff --exit-code -- contracts/schemas || {
            echo "::error::contracts/schemas differ from the models: run 'python scripts/export_schemas.py' in team_b/ and commit the result"
            exit 1
          }

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        if: hashFiles('team_b/Dockerfile') != ''
        run: docker build -t ticket-easy-team-b:ci team_b
      - name: No Dockerfile yet
        if: hashFiles('team_b/Dockerfile') == ''
        run: echo "team_b/Dockerfile does not exist yet (one-command startup is built by Track A); nothing to build."
