<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560" role="img" aria-label="Ticket-Easy architecture: agent, knowledge and tools services" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="560" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="558.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">THE THREE SERVICES</text><rect x="60" y="56" width="180" height="40" rx="20" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="150.0" y="80.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Customer chat</text><path d="M150,96 L150,134" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="330" y="56" width="180" height="40" rx="20" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="420.0" y="80.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Staff inbox</text><path d="M420,96 L420,134" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="600" y="56" width="180" height="40" rx="20" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="690.0" y="80.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Manager dashboard</text><path d="M690,96 L690,134" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="60" y="136" width="720" height="104" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="420.0" y="176.0" text-anchor="middle" font-size="16" font-weight="600" fill="#1b2b45">Agent service  ·  port 8010</text><text x="420.0" y="194.0" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">Chat, understanding, decisions, actions, hand-off, inbox and dashboard</text><text x="420.0" y="212.0" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">The only service customers and staff reach  ·  keeps conversations, decision logs and cases</text><rect x="60" y="300" width="340" height="92" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="230.0" y="333.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2b45">Knowledge service  ·  port 8001</text><text x="230.0" y="351.5" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">Finds the policy passage, screens risky</text><text x="230.0" y="369.5" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">messages, checks every action against the rules</text><rect x="440" y="300" width="340" height="92" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="610.0" y="333.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2b45">Tools service  ·  port 8101</text><text x="610.0" y="351.5" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">Turns an API description into tools the</text><text x="610.0" y="369.5" text-anchor="middle" font-size="12" fill="#1b2b45" fill-opacity="0.85">owner approves; the agent calls them over MCP</text><path d="M230,240 L230,300" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="240" y="275" text-anchor="start" font-size="11.5" font-weight="400" fill="#475467">HTTP / JSON</text><path d="M610,240 L610,300" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="620" y="275" text-anchor="start" font-size="11.5" font-weight="400" fill="#475467">MCP, one process per customer</text><rect x="60" y="448" width="160" height="64" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="140.0" y="475.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3b2a08">Documents + index</text><text x="140.0" y="493.5" text-anchor="middle" font-size="11.5" fill="#3b2a08" fill-opacity="0.85">approved rules</text><rect x="240" y="448" width="160" height="64" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="320.0" y="475.5" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">Ollama bge-m3</text><text x="320.0" y="493.5" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">local embeddings</text><path d="M150,392 L150,448" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M320,392 L320,448" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="440" y="448" width="160" height="64" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="520.0" y="475.5" text-anchor="middle" font-size="13" font-weight="600" fill="#3b2a08">Tools database</text><text x="520.0" y="493.5" text-anchor="middle" font-size="11.5" fill="#3b2a08" fill-opacity="0.85">proposals, approved tools</text><rect x="620" y="448" width="160" height="64" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="700.0" y="475.5" text-anchor="middle" font-size="13" font-weight="600" fill="#202124">The shop's own API</text><text x="700.0" y="493.5" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">approved connection</text><path d="M520,392 L520,448" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M700,392 L700,448" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="830" y="150" width="170" height="76" rx="12" fill="#f1f3f4" stroke="#80868b" stroke-width="1.5"/><text x="915.0" y="175.0" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">AI models</text><text x="915.0" y="193.0" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">Groq: understanding,</text><text x="915.0" y="211.0" text-anchor="middle" font-size="11.5" fill="#202124" fill-opacity="0.85">planning, wording</text><path d="M780,188 L830,188" fill="none" stroke="#667085" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><path d="M915,226 L915,346 L780,346" fill="none" stroke="#667085" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="920" y="420" text-anchor="middle" font-size="11.5" font-weight="400" fill="#667085" font-style="italic">The services share no code,</text><text x="920" y="437" text-anchor="middle" font-size="11.5" font-weight="400" fill="#667085" font-style="italic">only network calls.</text></svg>