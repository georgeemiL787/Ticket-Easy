# Ticket-Easy demo. Two profiles (use `make demo` or `make demo-full`, see the README):
#   light  the service with the simulated shop and policies, and a SQLite volume. Replies come from the rules.   (no AI model)
#   full   the same plus Ollama running qwen3:8b: the AI model helps understand messages (AGENT_LLM=ollama).
#   live   the agent talks to the real knowledge service (policy search, safety screen, rule checker) with the simulated shop.
#          The knowledge service embeds with bge-m3 from the Ollama on the host (ollama pull bge-m3). No chat AI model.
# Only one profile runs at a time (all use port 8010).

x-agent: &agent
  build:
    context: .
    dockerfile: services/agent/Dockerfile
  image: ticket-easy-agent
  ports:
    - "${AGENT_PORT:-8010}:8010"
  volumes:
    - agent_data:/data
  restart: unless-stopped
  environment: &agent-env
    AGENT_BACKENDS: simulated
    AGENT_STORE: sqlite
    AGENT_DB_PATH: /data/agent.sqlite3
    AGENT_FIXED_TODAY: ${AGENT_FIXED_TODAY:-2026-09-28}   # the demo orders are dated against this day
    AGENT_LOG_JSON: ${AGENT_LOG_JSON:-true}
    AGENT_RATE_LIMIT_PER_MIN: ${AGENT_RATE_LIMIT_PER_MIN:-20}
    AGENT_RETENTION_DAYS: ${AGENT_RETENTION_DAYS:-90}
    AGENT_CAPABILITY_TTL_S: ${AGENT_CAPABILITY_TTL_S:-60}
    AGENT_QUEUE_MAX_RUNS: ${AGENT_QUEUE_MAX_RUNS:-3}
    AGENT_ALERT_INTERVAL_S: ${AGENT_ALERT_INTERVAL_S:-60}
    AGENT_ALERT_WEBHOOK: ${AGENT_ALERT_WEBHOOK:-}
    AGENT_AUTH_REQUIRED: ${AGENT_AUTH_REQUIRED:-1}
    AGENT_SECRET_KEY: ${AGENT_SECRET_KEY:-}
    AGENT_COOKIE_SECURE: ${AGENT_COOKIE_SECURE:-0}
    AGENT_SESSION_HOURS: ${AGENT_SESSION_HOURS:-12}
    AGENT_CHAT_API_KEYS: ${AGENT_CHAT_API_KEYS:-}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).status == 200 else 1)"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

services:
  agent:
    <<: *agent
    profiles: ["light"]

  agent-full:
    <<: *agent
    profiles: ["full"]
    environment:
      <<: *agent-env
      AGENT_LLM: ollama
      OLLAMA_URL: http://ollama:11434
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen3:8b}
      AGENT_LLM_TIMEOUT_S: ${AGENT_LLM_TIMEOUT_S:-60}
      # these three need the AI model, which this profile starts: they are on for the demo
      AGENT_LLM_REWRITE: ${AGENT_LLM_REWRITE:-1}
      AGENT_LLM_POLICY: ${AGENT_LLM_POLICY:-1}
      AGENT_LLM_KNOWLEDGE: ${AGENT_LLM_KNOWLEDGE:-1}
      AGENT_LLM_REVIEW: ${AGENT_LLM_REVIEW:-1}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["full"]
    volumes:
      - ollama_models:/root/.ollama
    # start the server, make sure the model is there (downloaded once, about 5 GB), then keep serving
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull $${AGENT_OLLAMA_MODEL:-qwen3:8b}; touch /tmp/model-ready; wait $$pid"]
    environment:
      AGENT_OLLAMA_MODEL: ${AGENT_OLLAMA_MODEL:-qwen3:8b}
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/model-ready"]
      interval: 10s
      timeout: 3s
      retries: 180   # up to 30 minutes for the first download
      start_period: 20s

  # ---- profile "live": the agent + the real knowledge service and the tools service ----
  agent-live:
    <<: *agent
    profiles: ["live"]
    environment:
      <<: *agent-env
      AGENT_BACKENDS: live
      AGENT_KNOWLEDGE_URL: http://knowledge:8001
      AGENT_KNOWLEDGE_KEY: ${KNOWLEDGE_SERVICE_API_KEY:-}
      AGENT_KNOWLEDGE_ADMIN_KEY: ${KNOWLEDGE_ADMIN_API_KEY:-}
    depends_on:
      knowledge:
        condition: service_healthy

  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    image: ticket-easy-knowledge
    profiles: ["live"]
    volumes:
      - knowledge_var:/app/services/knowledge/var
    restart: unless-stopped
    environment:
      # embeddings (bge-m3) come from the Ollama on the host machine: `ollama pull bge-m3` once.
      # Without it the knowledge service builds a keyword-only index and still answers, with weaker search.
      OLLAMA_URL: ${KNOWLEDGE_OLLAMA_URL:-http://host.docker.internal:11434}
      KNOWLEDGE_EMBED_MODEL: ${KNOWLEDGE_EMBED_MODEL:-bge-m3}
      KNOWLEDGE_ADMIN_API_KEY: ${KNOWLEDGE_ADMIN_API_KEY:-}
      # set both and the knowledge service answers only callers that send this key (the agent does); empty: anybody can search (local use only)
      KNOWLEDGE_SERVICE_API_KEY: ${KNOWLEDGE_SERVICE_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s

  # the tools service: owners use its pages at http://localhost:8101; the agent is wired to it by hand (docs/INTEGRATION.md)
  tools:
    build:
      context: .
      dockerfile: services/tools/Dockerfile
    image: ticket-easy-tools
    profiles: ["live"]
    ports:
      - "127.0.0.1:${TOOLS_PORT:-8101}:8101"   # its owner pages have no sign-in: keep them on this machine
    volumes:
      - tools_data:/data
    restart: unless-stopped
    environment:
      TOOLS_DATABASE_PATH: /data/integration.sqlite3
      TOOLS_OPENAPI_FETCH_HOSTS: ${TOOLS_OPENAPI_FETCH_HOSTS:-loopback:*}
      TOOLS_SANDBOX_HOSTS: ${TOOLS_SANDBOX_HOSTS:-}
      # secrets come from the environment; empty session secret: a random one per start
      TOOLS_SESSION_SECRET: ${TOOLS_SESSION_SECRET:-}
      TOOLS_ADMIN_TOKEN: ${TOOLS_ADMIN_TOKEN:-}
      TOOLS_LIVE_DEMO_ENABLED: ${TOOLS_LIVE_DEMO_ENABLED:-false}
      TOOLS_LIVE_DEMO_HOSTS: ${TOOLS_LIVE_DEMO_HOSTS:-}
      # model provider for proposals (Ollama on the host by default; Groq or OpenRouter with their keys)
      LLM_PRIMARY: ${TOOLS_LLM_PRIMARY:-ollama}
      OLLAMA_BASE_URL: ${TOOLS_OLLAMA_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8101/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  agent_data:
  ollama_models:
  knowledge_var:
  tools_data:
