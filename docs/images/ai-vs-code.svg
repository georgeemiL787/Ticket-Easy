<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-label="The AI proposes and code decides" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="400" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="398.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">AI PROPOSES, CODE DECIDES</text><rect x="30" y="56" width="430" height="236" rx="14" fill="#e8f0fe" fill-opacity="0.6" stroke="#4a6fa5" stroke-width="1.5"/><text x="50" y="84" text-anchor="start" font-size="14.5" font-weight="700" fill="#1b2b45">AI jobs: they only propose</text><rect x="46" y="98" width="398" height="32" rx="8" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><text x="60" y="119" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Message reader</text><text x="430" y="119" text-anchor="end" font-size="12" font-weight="400" fill="#667085">language, intent, details</text><rect x="46" y="136" width="398" height="32" rx="8" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><text x="60" y="157" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Planner</text><text x="430" y="157" text-anchor="end" font-size="12" font-weight="400" fill="#667085">picks one move at a time, replans</text><rect x="46" y="174" width="398" height="32" rx="8" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><text x="60" y="195" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Knowledge agent</text><text x="430" y="195" text-anchor="end" font-size="12" font-weight="400" fill="#667085">answers only from found passages</text><rect x="46" y="212" width="398" height="32" rx="8" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><text x="60" y="233" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Reviewer</text><text x="430" y="233" text-anchor="end" font-size="12" font-weight="400" fill="#667085">can only make things stricter</text><rect x="46" y="250" width="398" height="32" rx="8" fill="#fff" stroke="#4a6fa5" stroke-opacity="0.6"/><text x="60" y="271" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Reply writer</text><text x="430" y="271" text-anchor="end" font-size="12" font-weight="400" fill="#667085">wording in the customer's style</text><path d="M464,174 L576,174" fill="none" stroke="#667085" stroke-width="2.4" marker-end="url(#ah)" stroke-linejoin="round"/><text x="520" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#475467">a proposal</text><rect x="580" y="56" width="430" height="236" rx="14" fill="#e6f4ea" fill-opacity="0.6" stroke="#3b7d4f" stroke-width="1.5"/><text x="600" y="84" text-anchor="start" font-size="14.5" font-weight="700" fill="#12301c">Code: it decides</text><rect x="596" y="98" width="398" height="32" rx="8" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><text x="610" y="119" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Move check</text><text x="980" y="119" text-anchor="end" font-size="12" font-weight="400" fill="#667085">on the menu, within limits</text><rect x="596" y="136" width="398" height="32" rx="8" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><text x="610" y="157" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Action checks</text><text x="980" y="157" text-anchor="end" font-size="12" font-weight="400" fill="#667085">identity, ownership, permission</text><rect x="596" y="174" width="398" height="32" rx="8" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><text x="610" y="195" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Policy rules</text><text x="980" y="195" text-anchor="end" font-size="12" font-weight="400" fill="#667085">allow / deny / needs a person</text><rect x="596" y="212" width="398" height="32" rx="8" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><text x="610" y="233" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Confirmation</text><text x="980" y="233" text-anchor="end" font-size="12" font-weight="400" fill="#667085">customer, or a person approves</text><rect x="596" y="250" width="398" height="32" rx="8" fill="#fff" stroke="#3b7d4f" stroke-opacity="0.6"/><text x="610" y="271" text-anchor="start" font-size="13" font-weight="600" fill="#1f2937">Result + facts check</text><text x="980" y="271" text-anchor="end" font-size="12" font-weight="400" fill="#667085">no new number, date, id or link</text><rect x="30" y="312" width="980" height="62" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="520" y="338" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3b2a08">Fixed step flow as a safety net</text><text x="520" y="358" text-anchor="middle" font-size="12" font-weight="400" fill="#3b2a08">Used when the AI is off, fails, or is refused twice in a row. The agent keeps working, with the same checks.</text></svg>