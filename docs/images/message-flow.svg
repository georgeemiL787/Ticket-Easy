<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" role="img" aria-label="What happens to a customer message" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#667085"/></marker></defs><rect width="1040" height="520" rx="16" fill="#ffffff"/><rect x="0.75" y="0.75" width="1038.5" height="518.5" rx="15.5" fill="none" stroke="#d0d5dd"/><text x="30" y="36" text-anchor="start" font-size="12" font-weight="700" fill="#667085">WHAT HAPPENS TO ONE MESSAGE</text><rect x="30" y="54" width="400" height="42" rx="21" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/><text x="230" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">"3ayez araga3 order NS-20934"   (a customer, in Arabizi)</text><rect x="30" y="130" width="148" height="118" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="104.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2b45">Understand</text><text x="104.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">Language: Arabizi</text><text x="104.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">Intent: return / refund</text><text x="104.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">Order: NS-20934</text><circle cx="46" cy="130" r="11" fill="#344054"/><text x="46" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><rect x="200" y="130" width="148" height="118" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="274.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12301c">Screen</text><text x="274.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">Fraud or regulator</text><text x="274.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">topic? Asked for</text><text x="274.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">a person?</text><circle cx="216" cy="130" r="11" fill="#344054"/><text x="216" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><path d="M180,189.0 L198,189.0" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="370" y="130" width="148" height="118" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="444.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2b45">Decide</text><text x="444.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">Planner picks ONE</text><text x="444.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">move: ask, look up,</text><text x="444.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">search policy, act</text><circle cx="386" cy="130" r="11" fill="#344054"/><text x="386" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><path d="M350,189.0 L368,189.0" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="540" y="130" width="148" height="118" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="614.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12301c">Check</text><text x="614.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">Identity, ownership,</text><text x="614.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">permission, then the</text><text x="614.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">rule: allow / deny / person</text><circle cx="556" cy="130" r="11" fill="#344054"/><text x="556" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><path d="M520,189.0 L538,189.0" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="710" y="130" width="148" height="118" rx="12" fill="#e6f4ea" stroke="#3b7d4f" stroke-width="1.5"/><text x="784.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12301c">Do</text><text x="784.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">Customer confirms,</text><text x="784.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">run exactly once,</text><text x="784.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#12301c" fill-opacity="0.85">verify the result</text><circle cx="726" cy="130" r="11" fill="#344054"/><text x="726" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><path d="M690,189.0 L708,189.0" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="880" y="130" width="148" height="118" rx="12" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5"/><text x="954.0" y="167.5" text-anchor="middle" font-size="15" font-weight="600" fill="#1b2b45">Reply</text><text x="954.0" y="185.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">In the customer's</text><text x="954.0" y="203.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">language, no number</text><text x="954.0" y="221.5" text-anchor="middle" font-size="11.5" fill="#1b2b45" fill-opacity="0.85">that is not a fact</text><circle cx="896" cy="130" r="11" fill="#344054"/><text x="896" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><path d="M860,189.0 L878,189.0" fill="none" stroke="#667085" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="30" y="330" width="760" height="78" rx="12" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/><text x="410.0" y="356.5" text-anchor="middle" font-size="15" font-weight="600" fill="#410e0b">Hand over to a person</text><text x="410.0" y="374.5" text-anchor="middle" font-size="12" fill="#410e0b" fill-opacity="0.85">A briefing is built: the conversation, the customer's data, the policy passage, what was tried, a suggested next step.</text><text x="410.0" y="392.5" text-anchor="middle" font-size="12" fill="#410e0b" fill-opacity="0.85">Staff claim the case, then reply, approve, reject, or give it back to the agent.</text><path d="M274.0,248 L274.0,330" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="282.0" y="296" text-anchor="start" font-size="11.5" font-weight="600" fill="#c5221f">risky topic</text><path d="M614.0,248 L614.0,330" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="622.0" y="296" text-anchor="start" font-size="11.5" font-weight="600" fill="#c5221f">rule says "person"</text><path d="M784.0,248 L784.0,330" fill="none" stroke="#c5221f" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="792.0" y="296" text-anchor="start" font-size="11.5" font-weight="600" fill="#c5221f">result unclear</text><path d="M790,369 L954.0,369 L954.0,250" fill="none" stroke="#3b7d4f" stroke-width="1.6" marker-end="url(#ah)" stroke-linejoin="round"/><text x="962.0" y="330" text-anchor="start" font-size="11.5" font-weight="600" fill="#3b7d4f">approved</text><text x="962.0" y="346" text-anchor="start" font-size="11.5" font-weight="600" fill="#3b7d4f">and done</text><text x="1010" y="80" text-anchor="end" font-size="11.5" font-weight="400" fill="#667085" font-style="italic">example: a EGP 3,450 refund</text><text x="1010" y="96" text-anchor="end" font-size="11.5" font-weight="400" fill="#667085" font-style="italic">is above the limit, so a person decides</text><rect x="30" y="440" width="980" height="52" rx="12" fill="#fdf3e1" stroke="#b07a1f" stroke-width="1.5"/><text x="520" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#3b2a08">Every message ends in one outcome and a decision log that says why</text><text x="520" y="481" text-anchor="middle" font-size="12" font-weight="400" fill="#3b2a08">answer  ·  question  ·  confirmation  ·  action  ·  refusal  ·  hand-over.   A write is never repeated automatically.</text></svg>