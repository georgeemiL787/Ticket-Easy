# Every change to the repository is checked here: the agent service (orchestrator/), the knowledge service (rag/),
# the tools service (tool_generation_mcp/) and the dashboard app (dashboard/).
# The jobs below are the "required checks" to switch on in the branch protection of main (see orchestrator/docs/ci.md).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (${{ matrix.store }} store)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [memory, sqlite]
    env:
      TEAM_B_STORE: ${{ matrix.store }}
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q

  knowledge:
    name: Knowledge service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src

  tools:
    name: Tools service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool_generation_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: tool_generation_mcp/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  scenarios:
    name: Scenario report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - name: Run every scenario and show the table in the job summary
        run: |
          set +e
          python scripts/scenario_report.py > scenario_report.txt
          status=$?
          {
            echo '## Scenario report'
            echo '```'
            cat scenario_report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  schemas:
    name: JSON Schemas are up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            orchestrator/requirements.txt
            orchestrator/requirements-dev.txt
      - run: pip install -e . -r requirements-dev.txt
      - name: Export the schemas again and compare with the committed ones
        run: |
          python scripts/export_schemas.py > /dev/null
          git diff --exit-code -- contracts/schemas || {
            echo "::error::contracts/schemas differ from the models: run 'python scripts/export_schemas.py' in orchestrator/ and commit the result"
            exit 1
          }

  dashboard:
    name: Dashboard (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the agent image
        run: docker build -f orchestrator/Dockerfile -t ticket-easy-team-b:ci .
      - name: Build the knowledge image
        run: docker build -f rag/Dockerfile -t ticket-easy-team-a:ci .
